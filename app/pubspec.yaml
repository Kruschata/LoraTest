name: blackout_buddy
description: A chat app for BlackoutBuddy - emergency communication via LoRa mesh.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Maintained Android Classic Bluetooth / RFCOMM fork. The old 0.4.0 package
  # still calls jcenter() and cannot be configured by current Android Gradle.
  flutter_bluetooth_serial_plus:
    path: third_party/flutter_bluetooth_serial_plus
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
